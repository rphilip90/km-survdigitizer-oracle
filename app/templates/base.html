<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Survival Curve Studio" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <div>
                <a href="/" class="brand">Survival Curve Studio</a>
                <p class="subtitle">Review-first batch extraction for Kaplan-Meier figures</p>
            </div>
            <div class="header-pills">
                <span class="header-pill">Batch review</span>
                <span class="header-pill">Manual crop control</span>
                <span class="header-pill">Export-ready results</span>
            </div>
        </div>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
